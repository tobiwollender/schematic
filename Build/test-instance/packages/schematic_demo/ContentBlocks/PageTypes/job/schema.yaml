# Read by schematic: every page of this type is a JobPosting.
type: JobPosting
locked: true
properties:
  title: title
  description: teaser
  # The page type stores its own values; schema.org expects fixed ones.
  employmentType:
    field: employmentType
    values:
      vollzeit: FULL_TIME
      teilzeit: PART_TIME
      befristet: TEMPORARY
      praktikum: INTERN
      minijob: PART_TIME
  validThrough: validUntil
