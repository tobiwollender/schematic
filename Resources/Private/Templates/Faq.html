<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:render partial="Header/All" arguments="{_all}" />
    <div class="schematic-faq">
        <f:for each="{items}" as="item">
            <details class="schematic-faq__item">
                <summary class="schematic-faq__question">{item.data.question}</summary>
                <div class="schematic-faq__answer">
                    <f:format.html>{item.data.answer}</f:format.html>
                </div>
            </details>
        </f:for>
    </div>
</f:section>
</html>
