<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="schematic-faq">
    <f:if condition="{data.header}">
        <h2 class="schematic-faq__header">{data.header}</h2>
    </f:if>
    <f:for each="{data.tx_schematic_faq_items}" as="item">
        <details class="schematic-faq__item">
            <summary class="schematic-faq__question">{item.question}</summary>
            <div class="schematic-faq__answer">
                <f:format.html>{item.answer}</f:format.html>
            </div>
        </details>
    </f:for>
</div>
</html>
