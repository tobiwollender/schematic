name: tobiwollender/schematic-faq
typeName: schematic_faq
group: default
prefixFields: false
fields:
  - identifier: header
    useExistingField: true
  - identifier: tx_schematic_faq_items
    type: Collection
    table: tx_schematic_faq_item
    foreign_field: parentid
    labelField: question
    appearance:
      collapseAll: true
      expandSingle: true
      useSortable: true
    fields:
      - identifier: question
        type: Text
        max: 512
        required: true
      - identifier: answer
        type: Textarea
        enableRichtext: true
        required: true
