name: tobiwollender/schematic-job-posting
table: tx_schematic_entity
typeField: type
typeName: JobPosting
prefixFields: false
labelField: title
fallbackLabelFields:
  - type
security:
  ignorePageTypeRestriction: true
fields:
  - identifier: tobiwollender/schematic-parent
    type: Basic
  - identifier: title
    type: Text
    max: 255
  - identifier: description
    type: Textarea
    rows: 5
    enableRichtext: true
  - identifier: jobDatesPalette
    type: Palette
    fields:
      - identifier: datePosted
        type: DateTime
        format: date
      - identifier: validThrough
        type: DateTime
        format: date
  - identifier: employmentType
    type: Select
    renderType: selectCheckBox
    items:
      - value: FULL_TIME
      - value: PART_TIME
      - value: CONTRACTOR
      - value: TEMPORARY
      - value: INTERN
      - value: VOLUNTEER
      - value: OTHER
  - identifier: identifier
    type: Text
  - identifier: tobiwollender/schematic-job-location
    type: Basic
  - identifier: remote
    type: Checkbox
    renderType: checkboxToggle
  - identifier: directApply
    type: Checkbox
    renderType: checkboxToggle
  - identifier: salaryPalette
    type: Palette
    fields:
      - identifier: salaryMin
        type: Number
        format: decimal
      - identifier: salaryMax
        type: Number
        format: decimal
      - type: Linebreak
      - identifier: salaryCurrency
        type: Text
        max: 3
        default: EUR
      - identifier: salaryUnit
        type: Select
        renderType: selectSingle
        items:
          - value: HOUR
          - value: MONTH
          - value: YEAR
        default: YEAR
