    type: Basic
  - identifier: title
    type: Text
    max: 255
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:title.headline'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:title.description'
  - identifier: description
    type: Textarea
    rows: 5
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:description'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:description.description'
  - identifier: image
    type: File
    allowed: common-image-types
    maxitems: 1
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:image'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:image.description'
  - identifier: author
    type: Text
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:author_name'
  - identifier: datePublished
    type: DateTime
    format: date
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:date_published'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:date_published.description'
