name: tobiwollender/schematic-news-article
title: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:type.NewsArticle'
table: tx_schematic_entity
typeField: type
typeName: NewsArticle
prefixFields: false
labelField: title
fallbackLabelFields:
  - type
security:
  ignorePageTypeRestriction: true
fields:
