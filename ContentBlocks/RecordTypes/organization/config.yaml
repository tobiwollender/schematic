name: tobiwollender/schematic-organization
title: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:type.Organization'
table: tx_schematic_entity
typeField: type
typeName: Organization
prefixFields: false
labelField: title
fallbackLabelFields:
  - type
security:
  ignorePageTypeRestriction: true
fields:
  - identifier: tobiwollender/schematic-parent
    type: Basic
  - identifier: title
    type: Text
    max: 255
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:title.name'
    required: true
  - identifier: description
    type: Textarea
    rows: 5
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:description'
  - identifier: url
    type: Link
    allowedTypes:
      - url
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:url'
  - identifier: logo
    type: File
    allowed: common-image-types
    maxitems: 1
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:logo'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:logo.description'
  - identifier: image
    type: File
    allowed: common-image-types
    maxitems: 1
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:image'
  - identifier: contactPalette
    type: Palette
    fields:
      - identifier: telephone
        type: Text
        size: 20
        label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:telephone'
      - identifier: email
        type: Email
        label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:email'
  - identifier: tobiwollender/schematic-address
    type: Basic
  - identifier: sameAs
    type: Textarea
    rows: 4
    label: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:same_as'
    description: 'LLL:EXT:schematic/Resources/Private/Language/locallang_db.xlf:same_as.description'
