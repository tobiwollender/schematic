name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^14.3'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-progress --no-interaction --with-all-dependencies --with "typo3/cms-core:${{ matrix.typo3 }}"
      - run: find Classes Configuration ext_localconf.php Build/test-instance/packages -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: .Build/bin/typo3 content-blocks:lint
