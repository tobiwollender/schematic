name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^14.3'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer validate --strict
      - run: composer require --no-progress --no-interaction "typo3/cms-core:${{ matrix.typo3 }}"
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -l
